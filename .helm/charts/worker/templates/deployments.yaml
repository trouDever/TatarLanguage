{{- range $role, $cmd := dict "worker" (printf "celery -A tatarlang.celery worker --loglevel=info --concurrency=%v" .Values.concurrency) "beat" "celery -A tatarlang.celery beat --loglevel=info --schedule=/tmp/celerybeat-schedule" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-{{ $role }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app.kubernetes.io/name: celery-{{ $role }}
    app.kubernetes.io/part-of: tatarlang
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-{{ $role }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-{{ $role }}
        app.kubernetes.io/part-of: tatarlang
    spec:
      containers:
        - name: {{ $role }}
          image: {{ include "tatarlang.image" (dict "root" $ "name" "backend") }}
          imagePullPolicy: {{ $.Values.global.pullPolicy }}
          command: ["sh", "-c", {{ $cmd | quote }}]
          resources:
            {{- toYaml (index $.Values.resources $role) | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ $.Values.global.secretName }}
            - configMapRef:
                name: {{ $.Values.global.configName }}
{{- end }}
