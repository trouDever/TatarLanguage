apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: {{ .Values.port }}
      targetPort: amqp
    - name: management
      port: {{ .Values.managementPort }}
      targetPort: management
