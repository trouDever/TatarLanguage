apiVersion: batch/v1
kind: Job
metadata:
  name: api-bootstrap-{{ .Release.Revision }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 900
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        {{- include "api.waitForDb" . | nindent 8 }}
      containers:
        - name: bootstrap
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py shell < /bootstrap/seed.py"]
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
            - configMapRef:
                name: {{ .Values.configName }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
      volumes:
        - name: bootstrap
          configMap:
            name: api-bootstrap
