apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  RABBITMQ_DEFAULT_USER: {{ .Values.secrets.rabbitUser | quote }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.secrets.rabbitPassword | quote }}
  CELERY_BROKER_URL: {{ printf "amqp://%s:%s@%s:%s//" .Values.secrets.rabbitUser .Values.secrets.rabbitPassword .Values.config.rabbitHost .Values.config.rabbitPort | quote }}
  DEMO_EMAIL: {{ .Values.secrets.demoEmail | quote }}
  DEMO_PASSWORD: {{ .Values.secrets.demoPassword | quote }}
